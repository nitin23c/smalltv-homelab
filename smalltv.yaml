# ESPHome firmware for ESP8266 240x240 "SmallTV" / "Smart Weather Clock"
# desk displays: a clock for one time zone, homelab health from Gatus and
# today's block count from Pi-hole v6.
#
# Gatus and Pi-hole addresses and the Pi-hole password are set on the
# device's own web page (http://<device-ip>/) and kept in its flash.
substitutions:
  name: smalltv
  friendly_name: SmallTV
  # Defaults until changed on the web page:
  clock_label: "New York"
  timezone: "America/New_York"   # any IANA zone, e.g. Europe/London
  weather_location: "40.71,-74.01"   # latitude,longitude for the weather
  # Shown on the screen only while the device has no Wi-Fi.
  ap_password: !secret ap_password

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - include/homelab_status.h
    - include/weather_icon.h
    - include/screen.h
  on_boot:
    priority: -100   # after SNTP has started
    then:
      - script.execute: load_settings
      - script.execute: apply_clock

# Fonts and icons, shared with preview/preview.yaml.
packages:
  assets: !include common/assets.yaml

esp8266:
  board: esp12e

logger:
  baud_rate: 115200   # serial log over the USB-C cable

wifi:
  # No Wi-Fi details in the config: on first boot, join the "SmallTV Setup"
  # hotspot (password on the screen) and pick your network.
  ap:
    ssid: "SmallTV Setup"
    password: ${ap_password}

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3
  # Our own page (web/), served from the device; nothing loads from the internet.
  js_url: ""
  css_url: ""
  js_include: web/app.js
  css_include: web/app.css
  sorting_groups:
    - id: grp_status
      name: "Status"
      sorting_weight: 1
    - id: grp_settings
      name: "Settings"
      sorting_weight: 2

json:

# Pulls in the HTTP and TLS client libraries used by homelab_status.h.
http_request:
  verify_ssl: false

sensor:
  - platform: template
    id: weather_temp
    name: "Weather temperature"
    icon: mdi:thermometer
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: services_up
    name: "Services up"
    icon: mdi:check-network
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: services_total
    name: "Services total"
    icon: mdi:server-network
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: pihole_pct
    name: "Pi-hole blocked percent"
    icon: mdi:pi-hole
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: pihole_blocked
    name: "Pi-hole blocked today"
    icon: mdi:shield-off
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: pihole_queries
    name: "Pi-hole queries today"
    icon: mdi:dns
    accuracy_decimals: 0
    update_interval: never
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

text_sensor:
  - platform: template
    id: weather_text
    name: "Weather"
    icon: mdi:weather-partly-cloudy
    update_interval: never
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP address"
  - platform: template
    id: services_down
    name: "Services down"
    icon: mdi:alert-circle
    update_interval: never
  - platform: template
    id: fetch_status
    name: "Last check"
    icon: mdi:information-outline
    update_interval: never
  - platform: template
    id: clock_zone
    name: "Clock"
    icon: mdi:clock-outline
    update_interval: never
  - platform: template
    id: device_time
    name: "Device time"
    icon: mdi:clock-check-outline
    update_interval: 30s
    lambda: |-
      auto t = id(clock_time).now();
      if (!t.is_valid()) return {"not synced"};
      return t.strftime("%Y-%m-%d %H:%M");
  - platform: version
    name: "ESPHome version"
    hide_timestamp: true

time:
  - platform: sntp
    id: clock_time
    timezone: ${timezone}   # used until a zone is picked on the web page

# Pi-hole app passwords live only here (filled from the settings store). The
# password text entities are write-only inputs and always read empty, so the
# passwords never reach Home Assistant or the web page's event stream.
globals:
  - id: ph1_pw
    type: std::string
    restore_value: false
  - id: ph2_pw
    type: std::string
    restore_value: false

text:
  - platform: template
    id: weather_location
    name: "Weather location"
    icon: mdi:map-marker-radius
    mode: text
    max_length: 40
    optimistic: true
    restore_value: false
    initial_value: "${weather_location}"
  - platform: template
    id: temp_unit
    name: "Temperature unit"
    icon: mdi:thermometer
    mode: text
    max_length: 1
    optimistic: true
    restore_value: false
    initial_value: "C"
  - platform: template
    id: clock_label_text
    name: "Clock label"
    icon: mdi:map-marker
    mode: text
    max_length: 20
    optimistic: true
    restore_value: false   # kept in the settings store instead
    initial_value: "${clock_label}"
  - platform: template
    id: tz_name
    name: "Time zone"
    icon: mdi:earth
    mode: text
    max_length: 40
    optimistic: true
    restore_value: false   # kept in the settings store instead
    initial_value: "${timezone}"
  - platform: template
    id: tz_rule
    name: "Time zone rule"
    icon: mdi:earth
    mode: text
    max_length: 64
    optimistic: true
    restore_value: false   # kept in the settings store instead
    initial_value: ""
  - platform: template
    id: ntp_list
    name: "NTP servers"
    icon: mdi:clock-check
    mode: text
    max_length: 64
    optimistic: true
    restore_value: false   # kept in the settings store instead
    initial_value: ""
  - platform: template
    id: gatus_url
    name: "Gatus URL"
    icon: mdi:list-status
    mode: text
    max_length: 64
    optimistic: true
    restore_value: false   # kept in the settings store instead
    initial_value: ""
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 1
  - platform: template
    id: pihole1_url
    name: "Pi-hole 1 URL"
    icon: mdi:pi-hole
    mode: text
    max_length: 64
    optimistic: true
    restore_value: false   # kept in the settings store instead
    initial_value: ""
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 2
  - platform: template
    id: pihole1_password
    name: "Pi-hole 1 app password"
    icon: mdi:key
    mode: password
    max_length: 64
    optimistic: false   # write-only: the state stays empty
    restore_value: false   # kept in the settings store instead
    initial_value: ""
    set_action:
      - lambda: 'if (!x.empty()) id(ph1_pw) = x;'
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 3
  - platform: template
    id: pihole2_url
    name: "Pi-hole 2 URL (optional)"
    icon: mdi:pi-hole
    mode: text
    max_length: 64
    optimistic: true
    restore_value: false   # kept in the settings store instead
    initial_value: ""
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 4
  - platform: template
    id: pihole2_password
    name: "Pi-hole 2 app password"
    icon: mdi:key
    mode: password
    max_length: 64
    optimistic: false   # write-only: the state stays empty
    restore_value: false   # kept in the settings store instead
    initial_value: ""
    set_action:
      - lambda: 'if (!x.empty()) id(ph2_pw) = x;'
    web_server:
      sorting_group_id: grp_settings
      sorting_weight: 5

button:
  - platform: template
    name: "Save settings"
    icon: mdi:content-save
    on_press:
      - script.execute: save_settings
      - lambda: weather::state().updated_ms = 0;
      - script.execute: apply_clock
      - script.execute: refresh
  - platform: restart
    name: "Restart"

script:
  # Every text setting, by the key used in the settings store.
  - id: load_settings
    then:
      - lambda: |-
          std::vector<std::pair<const char *, text::Text *>> fields = {
            {"label", id(clock_label_text)}, {"tz", id(tz_name)}, {"tz_rule", id(tz_rule)},
            {"ntp", id(ntp_list)}, {"gatus", id(gatus_url)},
            {"wx_loc", id(weather_location)}, {"wx_unit", id(temp_unit)},
            {"ph1", id(pihole1_url)}, {"ph2", id(pihole2_url)}};
          homelab::store::Settings kv;
          if (!homelab::store::read(kv)) {
            ESP_LOGI("homelab", "No saved settings yet; using defaults");
            return;
          }
          for (auto &f : fields)
            for (auto &p : kv)
              if (p.first == f.first) f.second->publish_state(p.second);
          for (auto &p : kv) {
            if (p.first == "ph1_pw") id(ph1_pw) = p.second;
            if (p.first == "ph2_pw") id(ph2_pw) = p.second;
          }
          ESP_LOGI("homelab", "Settings loaded");
  - id: save_settings
    then:
      - lambda: |-
          homelab::store::Settings kv = {
            {"label", id(clock_label_text).state}, {"tz", id(tz_name).state}, {"tz_rule", id(tz_rule).state},
            {"ntp", id(ntp_list).state}, {"gatus", id(gatus_url).state},
            {"wx_loc", id(weather_location).state}, {"wx_unit", id(temp_unit).state},
            {"ph1", id(pihole1_url).state}, {"ph1_pw", id(ph1_pw)},
            {"ph2", id(pihole2_url).state}, {"ph2_pw", id(ph2_pw)}};
          homelab::store::write(kv);
  - id: apply_clock
    then:
      - lambda: |-
          if (!id(tz_rule).state.empty() && !homelab::apply_timezone(id(tz_rule).state))
            ESP_LOGW("homelab", "Time zone rule not understood, keeping the previous zone");
          homelab::apply_ntp_servers(id(ntp_list).state);
          std::string tz = id(tz_rule).state.empty() ? "${timezone}" : id(tz_name).state;
          id(clock_zone).publish_state(id(clock_label_text).state + "|" + tz);
          id(screen).update();
  - id: refresh
    mode: single
    then:
      - lambda: |-
          if (!wifi::global_wifi_component->is_connected()) return;
          // Weather every 10 minutes (or right after Save)
          auto &w = weather::state();
          if (w.updated_ms == 0 || millis() - w.updated_ms > 10 * 60 * 1000) {
            weather::fetch(id(weather_location).state, id(temp_unit).state);
            if (w.ok) {
              id(weather_temp).publish_state(w.temp);
              id(weather_text).publish_state(weather::describe(w.code));
            }
          }
          auto &g = homelab::gatus();
          homelab::fetch_gatus(id(gatus_url).state, g);
          for (int i = 0; i < 2; i++) {
            auto &url = i == 0 ? id(pihole1_url).state : id(pihole2_url).state;
            auto &pw = i == 0 ? id(ph1_pw) : id(ph2_pw);
            homelab::pihole(i).fetch(url, pw, homelab::pihole_stats(i));
          }
          if (g.ok) {
            id(services_up).publish_state(g.up);
            id(services_total).publish_state(g.total);
            std::string names;
            for (auto &n : g.down) names += (names.empty() ? "" : ", ") + n;
            id(services_down).publish_state(names);
          }
          long q = 0, b = 0;
          bool any = false;
          for (int i = 0; i < 2; i++) {
            auto &s = homelab::pihole_stats(i);
            if (s.ok) { q += s.queries; b += s.blocked; any = true; }
          }
          if (any) {
            id(pihole_queries).publish_state(q);
            id(pihole_blocked).publish_state(b);
            id(pihole_pct).publish_state(q > 0 ? 100.0f * b / q : 0);
          }
          auto st = [](const std::string &url, bool ok) { return url.empty() ? "not set" : (ok ? "OK" : "error"); };
          char buf[96];
          snprintf(buf, sizeof(buf), "Gatus %s, Pi-hole 1 %s, Pi-hole 2 %s",
                   st(id(gatus_url).state, g.ok), st(id(pihole1_url).state, homelab::pihole_stats(0).ok),
                   st(id(pihole2_url).state, homelab::pihole_stats(1).ok));
          id(fetch_status).publish_state(buf);
          id(screen).update();

interval:
  # Animate the weather icon: only its 48x48 corner is sent to the panel.
  - interval: 200ms
    then:
      - lambda: |-
          static uint32_t frame = 0;
          if (!wifi::global_wifi_component->is_connected() || !weather::state().ok) return;
          auto &w = weather::state();
          weather::render(w.code, w.is_day, ++frame);
          weather::push(*id(screen), 186, 32);
  - interval: 60s
    startup_delay: 10s
    then:
      - script.execute: refresh

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13

output:
  - platform: esp8266_pwm
    id: backlight_pwm
    pin: GPIO5
    inverted: true

light:
  - platform: monochromatic
    name: Backlight
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON

display:
  - platform: mipi_spi
    id: screen
    model: ST7789V
    dc_pin: GPIO0
    reset_pin: GPIO2
    dimensions:
      width: 240
      height: 240
    invert_colors: true
    color_depth: 16
    data_rate: 40MHz
    update_interval: 15s
    lambda: |-
      // Drawing lives in include/screen.h; this only gathers the data.
      const uint32_t stale_ms = 5 * 60 * 1000;
      face::View v;
      v.wifi = wifi::global_wifi_component->is_connected();
      v.ap_password = "${ap_password}";
      v.now = id(clock_time).now();
      v.label = id(clock_label_text).state;
      auto &w = weather::state();
      v.wx_set = !id(weather_location).state.empty();
      v.wx_ok = w.ok;
      v.temp = w.temp; v.tmax = w.tmax; v.tmin = w.tmin; v.code = w.code;
      v.unit = id(temp_unit).state;
      auto &g = homelab::gatus();
      v.g_set = !id(gatus_url).state.empty();
      v.g_fresh = g.updated_ms != 0 && millis() - g.updated_ms < stale_ms;
      v.up = g.up; v.total = g.total; v.down = g.down;
      v.p_set = !id(pihole1_url).state.empty() || !id(pihole2_url).state.empty();
      for (int i = 0; i < 2; i++) {
        auto &s = homelab::pihole_stats(i);
        if (s.updated_ms != 0 && millis() - s.updated_ms < stale_ms) {
          v.queries += s.queries;
          v.blocked += s.blocked;
          v.p_any = true;
        }
      }
      static const face::Res res{id(font_time), id(font_temp), id(font_value), id(font_text), id(font_label),
                                   id(icon_day), id(icon_night), id(icon_services), id(icon_pihole)};
      face::draw(it, res, v);
